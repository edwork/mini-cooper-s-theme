name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theme:
    name: Theme is generated and valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Generated theme matches the generator
        run: python3 tools/build_theme.py --check
      - name: Theme YAML parses and every theme has variables
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml, pathlib, sys
          for f in sorted(pathlib.Path("themes").glob("*.yaml")):
              data = yaml.safe_load(f.read_text())
              assert isinstance(data, dict) and data, f"{f}: no themes"
              for name, theme in data.items():
                  modes = theme.get("modes", {})
                  assert set(modes) <= {"light", "dark"}, f"{f}: {name}: unknown modes {set(modes)}"
                  assert any(k != "modes" for k in theme) or modes, f"{f}: {name}: empty"
                  bad = [k for k, v in {**theme, **modes.get("light", {}), **modes.get("dark", {})}.items()
                         if k != "modes" and not isinstance(v, (str, int, float))]
                  assert not bad, f"{f}: {name}: non-scalar values {bad}"
                  print(f"{f}: {name!r} ok, modes={sorted(modes) or 'none'}")
          PY

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      # hacs/action's README documents @main
      - uses: hacs/action@main
        with:
          category: theme
